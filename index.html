<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="d-flex h-100">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-book"></i> KB</h1>
            </div>
            <div class="sidebar-actions">
                <button class="btn btn-primary btn-sm w-100" id="newArticleBtn">
                    <i class="fas fa-file-plus"></i> New Article
                </button>
                <button class="btn btn-secondary btn-sm w-100 mt-2" id="newDirBtn">
                    <i class="fas fa-folder-plus"></i> New Dir
                </button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search...">
            </div>
            <nav id="navTree" class="nav-tree mt-2">
                <!-- Tree will populate here -->
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <i class="fas fa-file-alt"></i>
                <p>Select an article or create a new one</p>
            </div>

            <!-- Search Results View -->
            <div id="searchResultsView" class="content-view" style="display:none;">
                <div class="results-header">
                    <h2>Search Results</h2>
                    <button class="btn btn-sm btn-outline-secondary" id="clearSearchBtn">
                        <i class="fas fa-times"></i> Clear
                    </button>
                </div>
                <div id="searchResultsList" class="results-list">
                    <!-- Results populated here -->
                </div>
            </div>

            <!-- Viewer View -->
            <div id="viewerView" class="content-view" style="display:none;">
                <div class="viewer-header">
                    <h1 id="viewerTitle"></h1>
                    <button class="btn btn-primary" id="editBtn">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                </div>
                <div id="viewerContent" class="viewer-content">
                    <!-- Content displayed here -->
                </div>
                <div id="buttonsContainer" class="buttons-container" style="display:none;">
                    <!-- Custom buttons will be rendered here -->
                </div>
            </div>

            <!-- Editor View -->
            <div id="editorView" class="content-view" style="display:none;">
                <div class="editor-header">
                    <button class="btn btn-secondary btn-sm" id="backBtn">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <input type="text" id="articleTitle" class="form-control ms-2 flex-grow-1" placeholder="Article title">
                    <button class="btn btn-success ms-2" id="saveBtn">
                        <i class="fas fa-save"></i> Save
                    </button>
                </div>
                <div class="editor-toolbar">
                    <button type="button" class="btn btn-sm btn-outline-secondary editor-btn" data-action="bold" title="Bold">
                        <i class="fas fa-bold"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary editor-btn" data-action="italic" title="Italic">
                        <i class="fas fa-italic"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary editor-btn" data-action="underline" title="Underline">
                        <i class="fas fa-underline"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary editor-btn" data-action="strikethrough" title="Strikethrough">
                        <i class="fas fa-strikethrough"></i>
                    </button>
                    <div class="vr ms-2 me-2"></div>
                    <button type="button" class="btn btn-sm btn-outline-secondary editor-btn" data-action="heading1" title="Heading 1">
                        H1
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary editor-btn" data-action="heading2" title="Heading 2">
                        H2
                    </button>
                    <div class="vr ms-2 me-2"></div>
                    <button type="button" class="btn btn-sm btn-outline-secondary editor-btn" data-action="ul" title="Bullet List">
                        <i class="fas fa-list-ul"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary editor-btn" data-action="ol" title="Ordered List">
                        <i class="fas fa-list-ol"></i>
                    </button>
                    <div class="vr ms-2 me-2"></div>
                    <button type="button" class="btn btn-sm btn-outline-secondary editor-btn" data-action="blockquote" title="Quote">
                        <i class="fas fa-quote-left"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary editor-btn" data-action="code" title="Code Block">
                        <i class="fas fa-code"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-info ms-2" id="addButtonBtn">
                        <i class="fas fa-plus"></i> Button
                    </button>
                </div>
                <div id="editor" class="editor" contenteditable="true"></div>
                <div class="editor-buttons-panel">
                    <h6>Custom Buttons</h6>
                    <div id="editorButtonsList" class="buttons-list">
                        <!-- Buttons listed here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Button Config Modal -->
    <div class="modal fade" id="buttonConfigModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Configure Button</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Button Label</label>
                        <input type="text" id="buttonLabel" class="form-control" placeholder="e.g., Export PDF">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">JavaScript Code</label>
                        <textarea id="buttonCode" class="form-control" rows="6" placeholder="alert('Hello!');"></textarea>
                        <small class="text-muted">Available: alert(), console.log(), and all global JS APIs</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveButtonBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="js/app.js"></script>
</body>
</html>
